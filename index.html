<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вкладка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="form" action="#">
        <h2 class="form__title">Створіть обліковий запис</h2>
        <p class="form__subtitle">Будь ласка, заповніть форму реєстрації</p>

        <!--Поле имя-->
        <div class="form__field">
            <label class="form__name" for="">Ім'я</label>
            <input class="form__input" type="text" placeholder="Введіть ваше ім'я" required>
        </div>

        <!--Поле почта-->
        <div class="form__field">
            <label class="form__email" for="">Email</label>
            <input class="form__input" type="email" placeholder="Введіть ваш Email" required>
        </div>


        <!--Поле пароль-->
        <div class="form__field">
            <label class="form__password" for="">Пароль</label>
            <input class="form__input" type="password" placeholder="Введіть пароль" required>
        </div>


        <!--Поле пароль проверка-->
        <div class="form__field">
            <label class="form__password" for="">Повторіть пароль</label>
            <input class="form__input" type="password" placeholder="Введіть пароль знову" required>
        </div>


        <!--Поле связь-->
        <div class="form__field">
            <label class="form__message" for="">Чи прив'язати Telegram до навчального запису?</label><br>
            <input type="radio" name="telegram" id="messageYes">
            <label for="messageYes">Так</label>
            <input type="radio" checked name="telegram" id="messageNo">
            <label for="messageNo">Ні</label>
            <input class="form__input" type="text" placeholder="Введіть логін у форматі @user_name">
        </div>


        <!--Поле политики-->
        <div class="form__field">
            <input class="form__checkbox" type="checkbox" required id="politico">
            <label class="form__checkbox" for="politico">Я згоден з <a href="#">правилами</a></label>
        </div>
        
        <!--Кнопка-->
        <input class="form__btn" type="submit" value="Надіслати">
        

    </form>
</body>
</html>
